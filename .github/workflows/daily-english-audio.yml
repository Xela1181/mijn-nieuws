name: Daily English audio briefing
on:
  schedule:
    # 05:30 Europe/Amsterdam, accounting for daylight saving time.
    - cron: '30 3,4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-english-briefing-main
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check Amsterdam hour
        id: time
        shell: bash
        run: |
          HOUR=$(TZ=Europe/Amsterdam date +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$HOUR" = "05" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.time.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: steps.time.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Install speech generator
        if: steps.time.outputs.run == 'true'
        run: python -m pip install edge-tts==7.2.3
      - name: Create daily MP3
        if: steps.time.outputs.run == 'true'
        run: python scripts/generate_briefing.py
      - name: Publish MP3 and transcript
        if: steps.time.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/briefing.mp3 audio/briefing.txt audio/briefing.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish daily English briefing"
            git push
          fi
