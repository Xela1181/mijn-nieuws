name: Update Mijn Nieuws RSS
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public RSS feeds
        run: python scripts/fetch_news.py
      - name: Select today's podcast episode
        run: python scripts/update_podcasts.py
      - name: Build daily shortlist
        run: python scripts/build_daily_selection.py
      - name: Verify shortlist
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('daily-selection.json').read_text(encoding='utf-8'))
          assert x['selection_mode']=='rss_shortlist'
          assert 0<=len(x['articles'])<=15, 'Shortlist exceeds maximum of 15 articles'\n          if not x['articles']:\n              print('WARNING: No eligible current news articles; publishing an empty shortlist rather than stale content')
          assert all(a.get('published') for a in x['articles']), 'Selected articles must have publication dates'
          assert len({a['url'] for a in x['articles']})==len(x['articles'])
          print('Daily shortlist:',len(x['articles']))
          PY
      - name: Commit updated news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json daily-selection.json podcast-tips.json
          if ! git diff --cached --quiet; then
            git commit -m "Update RSS news"
            git push
          fi
