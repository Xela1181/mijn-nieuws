name: Daily podcast recommendations
on:
  schedule:
    - cron: '10 4,5 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-podcast-recommendations
  cancel-in-progress: false
jobs:
  recommend:
    runs-on: ubuntu-latest
    steps:
      - name: Check Amsterdam time
        id: time
        shell: bash
        run: |
          HOUR=$(TZ=Europe/Amsterdam date +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$HOUR" = "06" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.time.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: steps.time.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Select daily episode
        if: steps.time.outputs.run == 'true'
        run: python scripts/update_podcasts.py
      - name: Publish seven-day recommendations
        if: steps.time.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add podcast-tips.json
          if ! git diff --cached --quiet; then
            git commit -m "Update seven-day podcast recommendations"
            git pull --rebase
            git push
          fi
