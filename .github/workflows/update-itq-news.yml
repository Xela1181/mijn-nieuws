name: Update ITQ Nieuws
on:
  schedule:
    - cron: '45 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect ITQ articles
        run: python scripts/update_itq_news.py
      - name: Publish ITQ news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add itq-news.json
          if ! git diff --cached --quiet; then
            git commit -m "Update ITQ news"
            git push
          fi
