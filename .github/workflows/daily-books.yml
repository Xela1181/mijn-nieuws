name: Daily book recommendations
on:
  schedule:
    - cron: '25 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recommend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select one book per day
        run: python scripts/update_books.py
      - name: Publish book recommendations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add book-tips.json
          if ! git diff --cached --quiet; then
            git commit -m "Update daily book recommendations"
            git pull --rebase
            git push
          fi
